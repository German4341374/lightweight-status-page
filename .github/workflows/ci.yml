name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests and static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4-alpine3.24
        env:
          POSTGRES_DB: status_page
          POSTGRES_USER: status_page
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U status_page -d status_page"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45  # v2
        with:
          php-version: "8.5"
          extensions: pdo_pgsql
          coverage: none
          tools: composer:2.10.2

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install locked dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check dependency security advisories
        run: composer audit --locked

      - name: Run formatting, PHPStan, and PHPUnit
        run: composer verify

      - name: Apply PostgreSQL migrations
        env:
          APP_ENV: ci
          APP_DEBUG: "false"
          APP_URL: http://127.0.0.1:8080
          APP_KEY: ci-only-application-key-value
          DB_DSN: pgsql:host=127.0.0.1;port=5432;dbname=status_page
          DB_USER: status_page
          DB_PASSWORD: ci_only_password
          ADMIN_USERNAME: status-admin
          ADMIN_PASSWORD_HASH: $2y$12$/yZZTsrTjkHEDrz5TUDqxunfNPkVvplBi6uvPx4E9PLBSYzlylDHi
          SESSION_SECURE: "false"
          SESSION_NAME: status_page_ci
        run: php bin/migrate.php

  container:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start stack
        run: docker compose up --build --detach

      - name: Wait for public health
        run: |
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:8080/health | grep '"status":"ok"'; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Verify public pages
        run: |
          curl --fail --silent http://127.0.0.1:8080/ | grep 'Reliable systems'
          curl --fail --silent http://127.0.0.1:8080/history | grep 'Incident history'
          curl --fail --silent http://127.0.0.1:8080/admin/login | grep 'Administrator'
          curl --fail --silent http://127.0.0.1:8080/feed.xml | grep '<rss version="2.0">'

      - name: Show logs on failure
        if: failure()
        run: docker compose logs || true

      - name: Stop environment
        if: always()
        run: docker compose down --volumes --remove-orphans || true
